version: '3.8'

services:
  scheduler-node1:
    build: .
    environment:
      NODE_ID: node-1
      PORT: "8080"
    ports:
      - "8085:8080"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  scheduler-node2:
    build: .
    environment:
      NODE_ID: node-2
      PORT: "8080"
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # ── Tier 2 Companion Services (started via: docker compose --profile live up) ──
  postgres:
    image: postgres:16-alpine
    profiles: ["live"]
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
